name: IT 뉴스 수집

# 휴대폰에서 이 화면의 "Run workflow" 를 눌러 돌리거나, 아침에 저절로 돈다.
#
# cron 은 UTC 로만 쓴다. 21:30 UTC = 다음날 06:30 (한국). 정시에 오지는
# 않는다 — 깃허브가 부하에 따라 보통 5~20분 늦게 돌린다.
#
# PC 쪽 예약 실행과는 확인 기록이 따로다. 그래서 아침에 폰에서 본 기사가
# PC 보고서에도 다시 나온다. 겹칠 뿐 빠지지는 않는다.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"

permissions:
  contents: write

# 두 번 연달아 누르면 앞의 것은 취소한다. 동시에 돌면 서로 push 를 밀어낸다.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 새 기사 수집
        run: |
          STAMP=$(TZ=Asia/Seoul date +%Y-%m-%d_%H%M)
          echo "수집 폴더: cloud/runs/$STAMP"
          python tools/collect.py --out "cloud/runs/$STAMP"

      # 제목 번역과 주요 이슈 선별. 키가 없으면 스스로 건너뛴다 —
      # 번역이 없다고 수집 결과까지 못 보게 되면 안 된다.
      - name: 한국어로 옮기기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY 가 없어 번역을 건너뜁니다."
            exit 0
          fi
          pip install --quiet --upgrade google-genai
          python tools/translate.py

      - name: 결과 페이지 만들기
        run: python tools/cloud_page.py

      - name: 결과 저장
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없어 커밋하지 않습니다."
          else
            git commit -m "휴대폰 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            # PC 에서 올리는 중이면 원격이 앞서 있다. 받아서 얹은 뒤 올린다.
            git pull --rebase
            git push
          fi
