.body{padding:6px 15px 16px;border-top:1px solid var(--line)}

.item{margin:0 0 12px}

.empty{color:var(--mut);font-size:13.5px}
.note{font-size:12.5px;color:var(--mut);background:var(--card);border:1px solid var(--line);
